name: Daily Market Data

on:
  # 起動は外部トリガー（workflow_dispatch）に一本化。
  # GitHubのscheduleは大幅に遅延して失敗メールの原因になっていたため使わない。
  workflow_dispatch: {}

permissions:
  contents: write   # data/latest.json をコミット・プッシュするために必要

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    env:
      HC_PING_URL: ${{ secrets.HC_PING_URL }}   # healthchecks.ioのPing URL（Secretsに登録）
    steps:
      - name: 監視に開始を通知
        run: '[ -z "$HC_PING_URL" ] || curl -fsS -m 10 --retry 3 "$HC_PING_URL/start" || true'

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 株価データを取得してJSONに書き出し
        run: python fetch_market_data.py

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "daily market data update"
          git pull --rebase origin main
          git push

      - name: 監視に成功を通知
        run: '[ -z "$HC_PING_URL" ] || curl -fsS -m 10 --retry 3 "$HC_PING_URL"'

      - name: 監視に失敗を通知
        if: failure()
        run: '[ -z "$HC_PING_URL" ] || curl -fsS -m 10 --retry 3 "$HC_PING_URL/fail" || true'
