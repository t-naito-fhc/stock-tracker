name: Daily Market Data

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # 手動実行ボタンも使えるようにしとく（テスト用に便利）

permissions:
  contents: write   # data/latest.json をコミット・プッシュするために必要

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 株価データを取得してJSONに書き出し
        run: python fetch_market_data.py

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "daily market data update"
          git pull --rebase origin main
          git push
